name: Build and test oc.user images linux/amd64, linux/arm64

on:
  push:
  
env: 
  imagetag: ${{ github.head_ref || github.ref_name || 'dev' }}
  base_image_release: '26.04'
    
jobs:
  build_matrix: 
    strategy:
      matrix:
        # target_mode: [ubuntu, hardening]
        target_mode: [hardening]
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # runs-on: self-hosted
    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          submodules: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: https://ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Buildx oc.user
        run: ./mkversion.sh ${{ matrix.target_mode }}

      # test only on linux/amd64
      - name: Build test image abcdesktopio/oc.user.${{ matrix.target_mode }}:test.${{ env.imagetag }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ubuntu
          platforms: linux/amd64
          push: true
          build-args: |
            TARGET_MODE=ubuntu
            BASE_IMAGE_RELEASE=${{ env.base_image_release }}
            BASE_IMAGE=ubuntu
          tags: ghcr.io/abcdesktopio/oc.user.ubuntu.${{ env.base_image_release }}:test.${{ env.imagetag }}

      - name: Run and test docker image abcdesktopio/oc.user.ubuntu.${{ env.base_image_release }}:test.${{ env.imagetag }}
        run: |
          TARGET_MODE=${{ matrix.target_mode }} ./make-test.sh ghcr.io/abcdesktopio/oc.user.ubuntu.${{ env.base_image_release }}:test.${{ env.imagetag }}
      
      - name: Build and push image oc.user.${{ matrix.target_mode }}:${{ env.imagetag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ubuntu
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TARGET_MODE=${{ matrix.target_mode }}
            TARGET_PRUNE=true
            BASE_IMAGE_RELEASE=${{ env.base_image_release }}
            BASE_IMAGE=ubuntu
          tags: ghcr.io/abcdesktopio/oc.user.${{ matrix.target_mode }}.${{ env.base_image_release }}:${{ env.imagetag }}
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/abcdesktopio/oc.user.${{ matrix.target_mode }}.${{ env.base_image_release }}:${{ env.imagetag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build and push sudo image oc.user.${{ matrix.target_mode }}.${{ env.base_image_release }}.sudo:${{ env.imagetag }} from abcdesktopio/oc.user.${{ matrix.target_mode }}:${{ env.imagetag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ubuntu.sudo
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TARGET_MODE=${{ matrix.target_mode }}
            TAG=${{ env.imagetag }}
            BASE_IMAGE=ghcr.io/abcdesktopio/oc.user.${{ matrix.target_mode }}.${{ env.base_image_release }}
            BASE_IMAGE_RELEASE=${{ env.imagetag }}
          tags: ghcr.io/abcdesktopio/oc.user.${{ matrix.target_mode }}.sudo.${{ env.base_image_release }}:${{ env.imagetag }}
 
