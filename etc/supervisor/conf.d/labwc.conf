[program:labwc]
command=/usr/bin/labwc
stdout_logfile=/var/log/desktop/labwc.log
autostart=true
autorestart=true
redirect_stderr=true
environment=DBUS_SESSION_BUS_ADDRESS="%(ENV_DBUS_SESSION_BUS_ADDRESS)s",CONTAINER_IP_ADDR="%(ENV_CONTAINER_IP_ADDR)s",KUBERNETES_SERVICE_HOST="%(ENV_KUBERNETES_SERVICE_HOST)s",SPAWNER_SERVICE_TCP_PORT=29786,BROADCAST_SERVICE_TCP_PORT=29784
